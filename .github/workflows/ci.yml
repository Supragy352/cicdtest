name: Build Raylib Project

on:
  push:
    branches:
      - main
      - master

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libasound2-dev libpulse-dev libx11-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Build Raylib for Linux
        run: |
          git clone https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          cmake ..
          make
          sudo make install

      - name: Build your project (Linux)
        run: |
          mkdir -p build && cd build
          cmake ..
          make

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.55 # or latest stable

      - name: Install dependencies for Emscripten
        run: sudo apt-get update && sudo apt-get install -y cmake git

      - name: Build Raylib for Web (Emscripten)
        run: |
          git clone https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          emcmake cmake .. -DBUILD_EXAMPLES=OFF -DPLATFORM=Web
          emmake make

      - name: Build your project for Web
        run: |
          mkdir -p build_web && cd build_web
          emcmake cmake ..
          emmake make